    '</ul>'+
    '<p class="lbl">Your nickname</p>'+
    '<div class="onb-card"><input id="onbPseudoIn" class="onb-input" value="'+escapeHtml(onbPseudo)+'" maxlength="24" autocomplete="off" spellcheck="false"><button class="btn ghost sm" id="onbReroll" style="margin-top:10px;width:auto;padding:8px 14px">🎲 Suggest one</button><p class="onb-mut" style="margin:9px 0 0">Type your own or draw a suggestion.</p></div>'+
    '<p class="lbl">How would you like to use it?</p>'+
    '<button class="onb-choice prim" id="onbAcct"><span class="ct">Sign in or create an account</span><span class="cs">Sync your data across devices and keep your history.</span></button>'+
    '<button class="onb-choice" id="onbAnon"><span class="ct">Continue anonymously</span><span class="cs">No account — data stays on this device only.</span></button>'+
    '<p class="note" style="text-align:center;margin-top:14px">This is a prototype, on sample data.</p>');
}
function onbAccountHtml(P){
  return '<div class="onb-badge">◈</div>'+
  (P
   ?'<h2 class="onb-h">Twoje konto</h2>'+
    '<p class="onb-p">Z kontem Twój dziennik i ustawienia są na każdym urządzeniu. Możesz je zmienić lub usunąć w każdej chwili.</p>'
   :'<h2 class="onb-h">Your account</h2>'+
    '<p class="onb-p">With an account your journal and settings are on every device. You can change or delete it anytime.</p>')+
    '<button class="btn" id="onbGoogle">'+(P?'Kontynuuj z Google':'Continue with Google')+'</button>'+
    '<p class="onb-or">'+(P?'albo e-mailem':'or with email')+'</p>'+
    '<input id="onbEmail" class="onb-input" type="email" placeholder="'+(P?'e-mail':'email')+'" autocomplete="email">'+
    '<input id="onbPass" class="onb-input" type="password" placeholder="'+(P?'hasło':'password')+'" autocomplete="current-password" style="margin-top:8px">'+
    '<div class="onb-err" id="onbErr"></div>'+
    '<button class="btn" id="onbRegister">'+(P?'Utwórz konto':'Create account')+'</button>'+
    '<button class="btn ghost" id="onbLogin" style="margin-top:10px">'+(P?'Mam już konto — zaloguj':'I already have an account — sign in')+'</button>'+
    '<button class="btn ghost" id="onbBack" style="margin-top:16px">'+(P?'Wróć':'Back')+'</button>';
}
function authGo(path,P){
  var em=($('#onbEmail')||{}).value||'', pw=($('#onbPass')||{}).value||'';
  if(!em||!pw){acctErr(P?'Podaj e-mail i hasło.':'Enter email and password.');return}
  acctErr(P?'Łączę…':'Connecting…');
  acct(path,{email:em,password:pw,pseudonym:onbPseudo||randPseudo()}).then(function(res){
    saveLocal('account',res.pseudonym||onbPseudo,res.token,em);closeOnboarding();
  }).catch(function(e){
    acctErr((P?'Nie udało się: ':'Failed: ')+(/Failed to fetch|NetworkError|HTTP 0/.test(e.message)
      ?(P?'serwer kont niedostępny — możesz wejść bez konta':'accounts server unavailable — you can enter without an account'):e.message));
  });
}
function renderOnboarding(mode){
  var P=lang==='pl'; mode=mode||'intro';
  if(!onbPseudo)onbPseudo=randPseudo();
  $('#onbIn').innerHTML=(mode==='account')?onbAccountHtml(P):onbIntroHtml(P);
  if(mode==='account'){
    $('#onbBack').onclick=function(){renderOnboarding('intro')};
    $('#onbRegister').onclick=function(){authGo('/auth/register',P)};
    $('#onbLogin').onclick=function(){authGo('/auth/login',P)};
    $('#onbGoogle').onclick=function(){acctErr(P?'Logowanie Google podłączymy przy uruchomieniu serwera kont.':'Google sign-in connects once the accounts server is live.')};
  }else{
    var inp=$('#onbPseudoIn'); if(inp)inp.oninput=function(){onbPseudo=inp.value};
    $('#onbReroll').onclick=function(){onbPseudo=randPseudo();var i=$('#onbPseudoIn');if(i)i.value=onbPseudo};
    $('#onbAcct').onclick=function(){renderOnboarding('account')};
    $('#onbAnon').onclick=function(){saveLocal('anon',onbPseudo||randPseudo(),null);closeOnboarding()};
  }
  var ov=$('#onbov'); if(ov)ov.scrollTop=0;
}
function openOnboarding(){renderOnboarding();$('#onbov').classList.add('on');$('#onbov').scrollTop=0}
function closeOnboarding(){$('#onbov').classList.remove('on');go('ida')}
function askIda(q){go('ida');setTimeout(function(){answerFromBase(q)},70)}
function paintAskIda(){
  var P=lang==='pl';
  var M={
    wiedza:P?['Zapytaj Idę o pojęcie','np. co znaczy „niewykrywalny”','Co znaczy niewykrywalny?']
            :['Ask Ida about a concept','e.g. what “undetectable” means','What does undetectable mean?'],
    zdrowie:P?['Zapytaj Idę o pojęcie, nie o wynik','„co znaczy niewykrywalny”, nie „czy mój wynik jest dobry”','Co znaczy niewykrywalny?']
            :['Ask Ida a concept, not a result','“what undetectable means”, not “is my result good”','What does undetectable mean?'],
    krag:P?['Zapytaj Idę','czy muszę komuś mówić o HIV','Czy muszę powiedzieć pracodawcy?']
          :['Ask Ida','whether you must tell anyone','Do I have to tell my employer?']
  };
  Object.keys(M).forEach(function(key){
    var el=$('#ask-'+key);if(!el)return;var m=M[key];
    el.innerHTML='<button class="askida"><span class="ai">◈</span><span><b class="axb"></b> — <span class="axs"></span></span><span class="arw">›</span></button>';
    el.querySelector('.axb').textContent=m[0];
    el.querySelector('.axs').textContent=m[1];
    el.querySelector('.askida').onclick=function(){askIda(m[2])};
  });
}
function paintOnbReplay(){
  var P=lang==='pl';
  var t1=$('#onbReplayT'),t2=$('#onbReplayS');
  if(t1)t1.textContent=P?'Powitanie od Idy':'Ida’s welcome';
  if(t2)t2.textContent=P?'Zobacz wprowadzenie jeszcze raz':'See the introduction again';
  var r=$('#onbReplay');if(r)r.onclick=function(){openOnboarding()};
}

apply();go('ida');openOnboarding();
})();
</script>
</body>
</html>
