<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krąg — prototyp UI v4</title>
<link rel="icon" type="image/svg+xml" href="brand/enso.svg">
<link rel="apple-touch-icon" href="brand/enso-192.png">
<style>
:root{
  --bg:#12161E;--app:#181D27;--surf:#212936;--surf-2:#2B3444;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --tx:#E4E8EE;--tx-2:#A3ACBB;--tx-3:#6E7889;
  --moss:#7E9B77;--moss-d:#12180F;--amber:#D9A441;--warn:#C98A6B;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);font-family:var(--sans);color:var(--tx);
  display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.device{width:390px;height:844px;background:var(--app);border-radius:38px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 40px 80px -24px rgba(0,0,0,.7);border:1px solid #0C0F15}
@media (max-width:480px),(max-height:900px){
  body{align-items:stretch}
  .device{width:100%;height:100dvh;border-radius:0;border:0;box-shadow:none}
}
.status{flex:0 0 auto;display:flex;justify-content:space-between;padding:14px 24px 0;font-size:12px;color:var(--tx-3)}
.topbar{flex:0 0 auto;padding:10px 22px 14px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);min-height:56px}
.topbar h1{font-family:var(--serif);font-size:21px;font-weight:400;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .right{margin-left:auto;display:flex;gap:9px;align-items:center}
.iconbtn{background:none;border:0;color:var(--tx-3);font-size:16px;cursor:pointer;padding:11px;min-width:42px;min-height:42px;line-height:1}
.iconbtn.ida{color:var(--moss);font-size:14px;font-weight:600}
.helpbtn{background:rgba(217,164,65,.14);border:1px solid rgba(217,164,65,.45);
  color:#E0BE7E;font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:9px;
  cursor:pointer;min-height:40px;letter-spacing:.01em;white-space:nowrap}
.helpbtn:hover{background:rgba(217,164,65,.22)}
.langbtn{background:var(--surf-2);border:1px solid var(--line);color:var(--tx-2);
  font-size:11px;font-weight:700;letter-spacing:.06em;padding:11px 12px;border-radius:7px;cursor:pointer;min-height:40px}
.back{background:none;border:0;color:var(--moss);font-size:14px;cursor:pointer;padding:11px 10px 11px 0;min-height:42px}
.view{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain}
.view::-webkit-scrollbar{width:0}
.pad{padding:20px 22px 30px}
.screen{display:none}.screen.on{display:block;animation:in .26s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:#141922;
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{background:none;border:0;padding:11px 2px 14px;cursor:pointer;color:var(--tx-3);
  font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1.2}
.tab .g{font-size:16px;line-height:1;opacity:.7}
.tab[aria-selected="true"]{color:var(--tx)}
.tab[aria-selected="true"] .g{opacity:1;color:var(--moss)}

.hello{font-family:var(--serif);font-size:26px;font-weight:400;line-height:1.2;margin:0 0 6px}
.sub{font-size:13.5px;color:var(--tx-3);margin:0 0 22px;line-height:1.5}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-3);
  font-weight:600;margin:26px 0 11px}
.lbl:first-child{margin-top:0}
.lbl .r{float:right;letter-spacing:0;text-transform:none;font-weight:400;font-size:11.5px;
  color:var(--moss);cursor:pointer}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px}
.card+.card{margin-top:10px}
.card p{margin:0;font-size:14px;line-height:1.55;color:var(--tx-2)}
.card p b{color:var(--tx);font-weight:600}
.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:first-child{padding-top:0}.row:last-child{border-bottom:0;padding-bottom:0}
.tick{flex:0 0 auto;width:25px;height:25px;border-radius:50%;border:1.5px solid #4C5666;
  background:none;cursor:pointer;color:transparent;font-size:13px;display:flex;align-items:center;justify-content:center}
.tick.on{background:var(--moss);border-color:var(--moss);color:var(--moss-d)}
.row .t{font-size:14.5px}.row .s{font-size:12px;color:var(--tx-3);margin-top:1px}
.row.done .t{color:var(--tx-3);text-decoration:line-through}
.row .m{margin-left:auto;font-size:11.5px;color:var(--tx-3);text-align:right}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:13px;cursor:pointer;background:var(--surf-2);border:1px solid var(--line);
  color:var(--tx-2);border-radius:999px;padding:11px 15px;min-height:40px}
.chip.on{background:var(--moss);border-color:var(--moss);color:var(--moss-d);font-weight:600}
.chip.sm{font-size:11.5px;padding:9px 12px;min-height:36px}
.seg{display:flex;background:var(--surf-2);border-radius:11px;padding:3px;margin-bottom:18px}
.seg button{flex:1;background:none;border:0;color:var(--tx-3);font-size:13px;padding:11px 9px;
  border-radius:9px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--surf);color:var(--tx);font-weight:600}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font-size:14.5px;font-weight:600;
  cursor:pointer;background:var(--moss);color:var(--moss-d)}
.btn.ghost{background:none;border:1px solid var(--line-2);color:var(--tx-2);font-weight:500}
.btn.sm{padding:11px;font-size:13.5px}
.btn[disabled]{background:var(--surf-2);color:var(--tx-3);cursor:default}

.post{border-bottom:1px solid var(--line);padding:17px 0}
.post:last-child{border-bottom:0}
.kind{display:inline-block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;font-weight:600;margin-bottom:9px}
.k-ask{background:rgba(126,155,119,.16);color:#9CBA94}
.k-mile{background:rgba(217,164,65,.15);color:var(--amber)}
.k-hard{background:rgba(150,162,185,.15);color:#A8B1C4}
.k-win{background:rgba(126,155,119,.16);color:#9CBA94}
.who{font-size:11.5px;color:var(--tx-3);margin-bottom:7px}
.post .bd{font-size:14.5px;line-height:1.58;color:var(--tx-2);margin:0 0 9px}
.trbar{font-size:11px;color:var(--tx-3);margin:0 0 11px;line-height:1.5}
.trbar button{background:none;border:0;color:var(--moss);font-size:11px;cursor:pointer;
  padding:0;text-decoration:underline;text-underline-offset:2px}
.rx{display:flex;gap:7px;flex-wrap:wrap}
.rx button{font-size:12px;cursor:pointer;background:none;border:1px solid var(--line);
  color:var(--tx-3);border-radius:999px;padding:6px 12px}
.rx button.on{border-color:var(--moss);color:#9CBA94}

.person{display:flex;gap:13px;align-items:flex-start;padding:15px 0;
  border-bottom:1px solid var(--line);cursor:pointer}
.person:last-child{border-bottom:0}
.av{flex:0 0 auto;width:44px;height:44px;border-radius:13px;overflow:hidden}
.pn{font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pmeta{font-size:12px;color:var(--tx-3);margin-top:3px;line-height:1.45}
.mb{font-size:9px;letter-spacing:.09em;text-transform:uppercase;background:rgba(217,164,65,.16);
  color:var(--amber);padding:2px 7px;border-radius:4px;font-weight:600}
.lg{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--surf-2);
  color:var(--tx-2);padding:2px 6px;border-radius:4px;font-weight:700;margin-right:4px}
.lg.match{background:rgba(126,155,119,.2);color:#9CBA94}
.tagline{font-size:12.5px;color:var(--tx-2);margin-top:6px;line-height:1.45}
.geo{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tx-3)}
.hero-av{width:76px;height:76px;border-radius:20px;overflow:hidden;margin:0 auto 14px;display:block}
.vouch{display:flex;gap:8px;font-size:12.5px;color:var(--tx-2);padding:11px 0;border-bottom:1px solid var(--line)}
.vouch:last-child{border-bottom:0}
.vouch .q{color:var(--tx-3);font-style:italic}

.bubble{max-width:88%;padding:13px 15px;border-radius:16px;font-size:14.5px;line-height:1.55;margin-bottom:10px}
.b-ida{background:var(--surf);border:1px solid var(--line);color:var(--tx-2);border-bottom-left-radius:5px}
.b-me{background:var(--moss);color:var(--moss-d);margin-left:auto;border-bottom-right-radius:5px;font-weight:500}
.src{font-size:11px;color:var(--tx-3);margin:-4px 0 14px;padding-left:4px;line-height:1.6}
.trust{display:inline-block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;font-weight:600;margin-right:6px}
.t1{background:rgba(126,155,119,.18);color:#9CBA94}
.t3{background:rgba(217,164,65,.16);color:var(--amber)}
.t4{background:rgba(150,162,185,.16);color:#A8B1C4}
.idahead{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.idahead .n{font-family:var(--serif);font-size:19px}
.idahead .r{font-size:12px;color:var(--tx-3);margin-top:2px;line-height:1.4}

.drop{border:1px dashed var(--line-2);border-radius:16px;padding:26px 18px;text-align:center;cursor:pointer}
.drop .i{font-size:26px;color:var(--tx-3);display:block;margin-bottom:10px}
.drop .t{font-size:14.5px;margin-bottom:5px}
.drop .s{font-size:12.5px;color:var(--tx-3);line-height:1.5}
.ext{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.ext:last-child{border-bottom:0}
.ext .k{font-size:13.5px;color:var(--tx-2);flex:1}
.ext input{width:92px;background:var(--surf-2);border:1px solid var(--line);border-radius:9px;
  padding:9px 10px;color:var(--tx);font-family:inherit;font-size:14px;text-align:right}
.conf{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:4px;font-weight:600}
.c-hi{background:rgba(126,155,119,.16);color:#9CBA94}
.c-lo{background:rgba(201,138,107,.18);color:var(--warn)}

.med{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.med:last-child{border-bottom:0}
.med .t{font-size:14.5px}.med .s{font-size:12px;color:var(--tx-3);margin-top:2px}
.med .x{margin-left:auto;background:none;border:0;color:var(--tx-3);font-size:15px;cursor:pointer;padding:11px;min-width:42px;min-height:42px}
.inter{border-radius:13px;padding:14px;margin-bottom:10px;border:1px solid}
.i-stop{background:rgba(201,90,90,.09);border-color:rgba(201,90,90,.35)}
.i-care{background:rgba(217,164,65,.09);border-color:rgba(217,164,65,.3)}
.i-ok{background:rgba(126,155,119,.08);border-color:rgba(126,155,119,.28)}
.inter h4{font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 7px}
.i-stop h4{color:#D08A8A}.i-care h4{color:var(--amber)}.i-ok h4{color:#9CBA94}
.inter p{font-size:13.5px;line-height:1.55;margin:0;color:var(--tx-2)}
.inter .pair{font-size:14px;color:var(--tx);font-weight:600;margin-bottom:6px}

.chartcard{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px 14px 10px}
.chartcard svg{display:block;width:100%;height:auto}
.axis{fill:var(--tx-3);font-size:8.5px}
.gl{stroke:rgba(255,255,255,.06)}.thr{stroke:rgba(217,164,65,.45);stroke-dasharray:3 3}
.ln{fill:none;stroke:var(--moss);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--moss)}
.foot{font-size:11.5px;color:var(--tx-3);line-height:1.5;margin:12px 0 0;padding:0 2px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--tx-3);margin-bottom:6px}
.field input{width:100%;background:var(--surf);border:1px solid var(--line);
  border-radius:11px;padding:12px 13px;color:var(--tx);font-family:inherit;font-size:14.5px}
.set{display:flex;align-items:flex-start;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .t{font-size:14.5px}.set .s{font-size:12.5px;color:var(--tx-3);margin-top:3px;line-height:1.45;max-width:23ch}
.sw{margin-left:auto;flex:0 0 auto;width:46px;height:27px;border-radius:999px;background:var(--surf-2);
  border:1px solid var(--line);cursor:pointer;position:relative}
.sw i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:#77808F;transition:transform .18s,background .18s}
.sw.on{background:rgba(126,155,119,.4);border-color:var(--moss)}
.sw.on i{transform:translateX(19px);background:var(--moss)}
.langrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.langrow:last-child{border-bottom:0}
.langcode{flex:0 0 auto;width:38px;height:30px;border-radius:8px;background:var(--surf-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  letter-spacing:.06em;color:var(--tx-2)}
.langrow.on .langcode{background:var(--moss);color:var(--moss-d)}
.langrow .nm{font-size:14.5px}
.langrow .cv{font-size:11.5px;color:var(--tx-3);margin-top:2px}
.langrow .ck{margin-left:auto;color:var(--moss);font-size:14px;opacity:0}
.langrow.on .ck{opacity:1}
.note{font-size:11.5px;color:var(--tx-3);line-height:1.55;margin-top:12px;
  padding:11px 13px;border:1px dashed var(--line-2);border-radius:11px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:14px;width:1px;background:var(--line-2)}
.tle{position:relative;padding:0 0 22px}
.tld{position:absolute;left:-25px;top:3px;width:11px;height:11px;border-radius:50%;
  background:var(--surf-2);border:2px solid var(--app)}
.tld.res{background:var(--moss)}.tld.mile{background:var(--amber)}
.tld.med{background:#7FA3A8}.tld.diag{background:#8C93B8}
.tle .dt{font-size:11px;color:var(--tx-3);letter-spacing:.04em;margin-bottom:3px}
.tle .ti{font-size:14.5px;color:var(--tx);line-height:1.4}
.tle .tv{font-size:13px;color:var(--tx-2);margin-top:4px;line-height:1.5}
.tle .auto{display:inline-block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  background:rgba(217,164,65,.15);color:var(--amber);padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:600}
.mod{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mod:last-child{border-bottom:0}
.modn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--surf-2);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;color:var(--tx-2)}
.modn.on{background:rgba(126,155,119,.2);color:#9CBA94}
.two{display:grid;grid-template-columns:1fr;gap:10px}
.colbox{border-radius:14px;padding:15px;border:1px solid}
.cant{background:rgba(140,147,184,.07);border-color:rgba(140,147,184,.25)}
.can{background:rgba(126,155,119,.08);border-color:rgba(126,155,119,.28)}
.colbox h4{font-size:10px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 10px}
.cant h4{color:#A8B1C4}.can h4{color:#9CBA94}
.colbox ul{margin:0;padding:0;list-style:none}
.colbox li{font-size:13.5px;line-height:1.5;color:var(--tx-2);padding:6px 0 6px 16px;position:relative}
.colbox li::before{content:"·";position:absolute;left:4px;color:var(--tx-3)}
.lead2{font-size:15px;line-height:1.62;color:var(--tx-2);margin:0 0 16px}
.thr2{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.thr2:last-child{border-bottom:0}
.thr2 .n{flex:0 0 66px;font-family:var(--serif);font-size:17px;color:var(--moss)}
.thr2 .d{font-size:13.5px;line-height:1.5;color:var(--tx-2)}
.thr2 .d b{color:var(--tx);font-weight:600}
.warnbox{background:rgba(217,164,65,.09);border:1px solid rgba(217,164,65,.3);
  border-radius:14px;padding:15px;margin:14px 0}
.warnbox h4{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--amber);margin:0 0 9px}
.warnbox p{font-size:14px;line-height:1.55;color:#E3CFA4;margin:0}
.warnbox p+p{margin-top:10px}
.softbox{background:rgba(126,155,119,.08);border:1px solid rgba(126,155,119,.28);
  border-radius:14px;padding:15px;margin:14px 0}
.softbox p{font-size:14px;line-height:1.55;color:#B4C4AF;margin:0}
.bhead{font-family:var(--serif);font-size:26px;font-weight:400;line-height:1.22;margin:0 0 8px}
.bline{font-size:14.5px;line-height:1.6;color:var(--tx-2);margin:0 0 18px}
.bitem{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.bitem:last-child{border-bottom:0}
.bmark{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--moss);margin-top:8px}
.bmark.q{background:var(--tx-3)}
.bitem .bt{font-size:14.5px;line-height:1.45}
.bitem .bs{font-size:12.5px;color:var(--tx-3);margin-top:3px;line-height:1.45}
.bitem .ba{margin-left:auto;flex:0 0 auto;background:none;border:1px solid var(--line-2);
  color:var(--tx-2);font-size:12px;border-radius:999px;padding:6px 12px;cursor:pointer}
.libcard{background:var(--surf-2);border-radius:12px;padding:11px 13px;margin-top:10px;
  font-size:12.5px;color:var(--tx-2);display:flex;align-items:center;gap:9px;cursor:pointer;line-height:1.4}
.libcard b{color:var(--tx);font-weight:600}
.geopick{display:flex;flex-wrap:wrap;gap:7px}
.tile{display:flex;gap:15px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);
  border-radius:16px;padding:18px;margin-bottom:11px;cursor:pointer}
.tile:hover{border-color:var(--line-2)}
.tnum{flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:var(--surf-2);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--moss)}
.tt{font-family:var(--serif);font-size:19px;line-height:1.2;margin-bottom:5px}
.ts{font-size:13px;color:var(--tx-3);line-height:1.5}
.tbar{height:3px;background:var(--surf-2);border-radius:2px;margin:12px 0 7px;max-width:190px}
.tbar i{display:block;height:100%;background:var(--moss);border-radius:2px}
.tmeta{display:flex;gap:7px;font-size:11.5px;color:var(--tx-3)}
.stnum{font-family:var(--serif);font-size:21px;font-weight:400;display:block}
.stlbl{font-size:10.5px;color:var(--tx-3)}
.prow{display:flex;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pico{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--surf-2);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx-2)}
.pt2{font-size:14px}.ps2{font-size:12px;color:var(--tx-3);margin-top:2px}
.pval{margin-left:auto;font-family:var(--serif);font-size:17px;color:var(--moss)}
.urg{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#E0A46B;
  font-weight:700;margin:0 0 10px}
.gatewarn{font-size:11.5px;line-height:1.5;color:var(--tx-3);border-top:1px solid var(--line);
  margin-top:11px;padding-top:9px}

 lessonP1:{pl:"Skuteczne leczenie obniża liczbę kopii wirusa we krwi poniżej progu, którego laboratorium nie potrafi zmierzyć — zwykle poniżej 50 kopii na mililitr.",en:"Effective treatment lowers the number of virus copies in the blood below the level a laboratory can measure — usually under 50 copies per millilitre.",uk:"Ефективне лікування знижує кількість копій вірусу в крові нижче порога вимірювання — зазвичай менше 50 копій на мілілітр.",ru:"Эффективное лечение снижает количество копий вируса в крови ниже порога измерения — обычно менее 50 копий на миллилитр.",de:"Eine wirksame Behandlung senkt die Viruskopien unter die Nachweisgrenze — meist unter 50 Kopien pro Milliliter.",cs:"Účinná léčba sníží počet kopií viru pod měřitelnou hranici — obvykle pod 50 kopií na mililitr.",sk:"Účinná liečba zníži počet kópií vírusu pod merateľnú hranicu — zvyčajne pod 50 kópií na mililiter."},
 lessonP2:{pl:"Wirus nie znika z organizmu i leki bierze się dalej. Zmienia się to, co ten wynik oznacza w praktyce.",en:"The virus does not leave the body and treatment continues. What changes is what the result means in practice.",uk:"Вірус не зникає з організму, і ліки приймають далі. Змінюється те, що цей результат означає на практиці.",ru:"Вирус не исчезает из организма, и лекарства принимают дальше. Меняется то, что этот результат означает на практике.",de:"Das Virus verschwindet nicht und die Behandlung geht weiter.",cs:"Virus nezmizí a léčba pokračuje.",sk:"Vírus nezmizne a liečba pokračuje."},

 lessonOK:{pl:"Tak. Leki bierze się dalej — to one utrzymują ten poziom.",en:"Correct. Treatment continues — it is what keeps the level there.",uk:"Так. Ліки приймають далі — саме вони утримують цей рівень.",ru:"Верно. Лекарства принимают дальше — именно они удерживают этот уровень.",de:"Richtig. Die Behandlung geht weiter.",cs:"Správně. Léčba pokračuje.",sk:"Správne. Liečba pokračuje."},

dontChange:{fr:"N'arrête et ne modifie rien de toi-même. Montre ceci à ta clinique ou à ta pharmacie.",es:"No suspendas ni cambies nada por tu cuenta. Muestra esto en tu clínica o farmacia.",it:"Non sospendere né cambiare nulla da solo. Mostra questo in clinica o in farmacia.",nl:"Stop of verander niets op eigen houtje. Laat dit zien in je kliniek of apotheek.",pt:"Não pares nem alteres nada por tua conta. Mostra isto na clínica ou farmácia.",sv:"Sluta inte och ändra ingenting på egen hand. Visa detta på kliniken eller apoteket.",da:"Stop eller ændr ikke noget på egen hånd. Vis dette på klinikken eller apoteket.",fi:"Älä lopeta tai muuta mitään omin päin. Näytä tämä klinikalla tai apteekissa.",ro:"Nu opri și nu schimba nimic singur. Arată acest lucru la clinică sau la farmacie.",hu:"Ne hagyj el és ne változtass semmit egyedül. Mutasd meg ezt a klinikán vagy a gyógyszertárban.",bg:"Не спирай и не променяй нищо сам. Покажи това в клиниката или аптеката.",el:"Μη σταματάς και μην αλλάζεις τίποτα μόνος. Δείξε το στην κλινική ή στο φαρμακείο.",hr:"Ne prekidaj i ne mijenjaj ništa sam. Pokaži ovo u klinici ili ljekarni.",sl:"Ničesar ne opusti in ne spreminjaj sam. To pokaži v kliniki ali lekarni.",lt:"Nenutrauk ir nekeisk nieko pats. Parodyk tai klinikoje ar vaistinėje.",lv:"Neko nepārtrauc un nemaini pats. Parādi to klīnikā vai aptiekā.",et:"Ära lõpeta ega muuda midagi omal käel. Näita seda kliinikus või apteegis.",ga:"Ná stop agus ná hathraigh aon rud leat féin. Taispeáin é seo i do chlinic nó i do chógaslann.",mt:"Tieqafx u tibdilx xejn waħdek. Uri dan fil-klinika jew fl-ispiżerija.",rm:"Na fermar e na midar nagut sez. Mussar quai a la clinica u a la apoteca."},

function avatar(seed,size){
  var h=0;for(var i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
  var pal=[['#7E9B77','#4C6350'],['#8C93B8','#4A5070'],['#C0A176','#6E5A3C'],
           ['#7FA3A8','#40595E'],['#A88C9E','#5D4655'],['#93A87F','#4F5E44']];
  var c=pal[h%pal.length],s='',g=3,cell=size/g;
  for(var y=0;y<g;y++)for(var x=0;x<g;x++){
    h=(h*1103515245+12345)>>>0;
    if((h>>16)%100<52)s+='<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'" fill="'+c[0]+'" opacity="'+(0.35+((h>>8)%60)/100)+'"/>';
  }
  return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" height="100%" aria-hidden="true"><rect width="'+size+'" height="'+size+'" fill="'+c[1]+'"/>'+s+'</svg>';
}

ie, wydzielina pochwy i mleko kobiece.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0005","b":"transmisja","t":"mity","w":"Komary i inne owady nie przenoszą HIV.","held":"unverified","s":"Centers for Disease Control and Prevention (US)","c":"OFFICIAL","ver":null,"gate":true},{"id":"0006","b":"transmisja","t":"ryzyko na akt","w":"Na 10 000 kontaktów analnych biernych z osobą zakażoną, nieleczoną i bez zabezpieczeń, do zakażenia dochodzi około 138 razy.","held":"unverified","s":"Patel P. i in., AIDS 2014;28(10):1509–1519","c":"VERIFIED","ver":null,"gate":true},{"id":"0007","b":"transmisja","t":"ryzyko na akt","w":"Seks analny czynny to około 11 zakażeń na 10 000 kontaktów.","held":"unverified","s":"Patel P. i in., AIDS 2014;28(10):1509–1519","c":"VERIFIED","ver":null,"gate":true},{"id":"0008","b":"transmisja","t":"ryzyko na akt","w":"Seks waginalny to około 8 zakażeń na 10 000 kontaktów dla strony przyjmującej i około 4 dla strony wprowadzającej.","held":"unverified","s":"Patel P. i in., AIDS 2014;28(10):1509–1519","c":"VERIFIED","ver":null,"gate":true},{"id":"0009","b":"transmisja","t":"ryzyko na akt","w":"Wspólna igła do narkotyków to około 63 zakażenia na 10 000 użyć.","held":"unverified","s":"Patel P. i in., AIDS 2014;28(10):1509–1519","c":"VERIFIED","ver":null,"gate":true},{"id":"0010","b":"transmisja","t":"ryzyko na akt","w":"Przetoczenie zakażonej krwi ma bardzo wysokie ryzyko — około 9250 na 10 000.","held":"unverified","s":"Patel P. i in., AIDS 2014;28(10):1509–1519","c":"VERIFIED","ver":null,"gate":true},{"id":"0011","b":"transmisja","t":"ryzyko na akt","w":"Seks oralny uznaje się za niskie ryzyko, a plucie czy ugryzienie za znikome.","held":"unverified","s":"Patel P. i in., AIDS 2014;28(10):1509–1519","c":"VERIFIED","ver":null,"gate":true},{"id":"0012","b":"transmisja","t":"co podnosi ryzyko","w":"Ryzyko zakażenia rośnie, gdy druga osoba ma świeże zakażenie, wysoką wiremię albo inną chorobę przenoszoną drogą płciową.","held":"unverified","s":"Patel P. i in., AIDS 2014;28(10):1509–1519","c":"VERIFIED","ver":null,"gate":true},{"id":"0013","b":"przebieg","t":"faza ostra","w":"Pierwsze objawy mogą przypominać grypę: gorączka, ból gardła, wysypka, powiększone węzły chłonne — zwykle 2 do 4 tygodni po zakażeniu.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0014","b":"przebieg","t":"faza bezobjawowa","w":"Po fazie ostrej przychodzi faza bezobjawowa, która bez leczenia może trwać wiele lat.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0015","b":"przebieg","t":"AIDS","w":"AIDS rozpoznaje się u osoby z HIV wtedy, gdy pojawia się jedna z tak zwanych chorób wskaźnikowych.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0016","b":"przebieg","t":"CD4","w":"Liczba CD4 pokazuje, jak silny jest Twój układ odpornościowy. Wynik poniżej 200 oznacza duże ryzyko zakażeń oportunistycznych.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0017","b":"przebieg","t":"wiremia","w":"Wiremia to liczba kopii wirusa we krwi. Celem leczenia jest, żeby była niewykrywalna.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0018","b":"przebieg","t":"niewykrywalny","w":"„Niewykrywalny\" znaczy „poniżej progu testu\", zwykle mniej niż 50 kopii na mililitr — a nie „bez wirusa\".","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"0019","b":"przebieg","t":"późne rozpoznania","w":"W Polsce w grudniu 2024 roku średnia liczba CD4 przy rozpoznaniu AIDS wynosiła 71 — to bardzo późne rozpoznania.","held":"unverified","s":"NIZP-PZH","c":"OFFICIAL","ver":null,"gate":true},{"id":"0020","b":"leczenie","t":"czym jest ART","w":"Leczenie HIV nazywa się terapią antyretrowirusową i przyjmuje się je codziennie, przez całe życie.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0021","b":"leczenie","t":"klasy leków","w":"Główne klasy leków to NRTI, NNRTI, inhibitory proteazy, inhibitory integrazy, inhibitory wejścia oraz lenakapawir.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0022","b":"leczenie","t":"pierwszy rzut","w":"Współczesne leczenie pierwszego rzutu opiera się najczęściej na leku z grupy inhibitorów integrazy, na przykład dolutegrawirze lub biktegrawirze.","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"0023","b":"leczenie","t":"terapia iniekcyjna","w":"Istnieje terapia w zastrzykach — kabotegrawir z rylpiwiryną — podawana co jeden lub dwa miesiące zamiast codziennych tabletek.","held":"unverified","s":"University of Washington / HRSA","c":"VERIFIED","ver":null,"gate":true},{"id":"0024","b":"leczenie","t":"terapia iniekcyjna","w":"Terapia w zastrzykach jest tylko dla osób, które już mają niewykrywalną wiremię i nie miały niepowodzeń leczenia. Nie zaczyna się od niej leczenia.","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"0025","b":"leczenie","t":"adherencja","w":"Regularne przyjmowanie leków jest kluczowe. Pomijane dawki mogą prowadzić do lekooporności.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0026","b":"leczenie","t":"rokowanie","w":"Dobrze leczony HIV pozwala żyć długo i w zdrowiu, przez czas zbliżony do długości życia osób bez HIV.","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"0027","b":"uu","t":"czym jest U=U","w":"U=U znaczy: niewykrywalny równa się niezakaźny. Osoba z niewykrywalną wiremią nie przenosi HIV drogą seksualną.","held":"unverified","s":"Centers for Disease Control and Prevention (US)","c":"OFFICIAL","ver":null,"gate":true},{"id":"0028","b":"uu","t":"podstawa dowodowa","w":"U=U potwierdziły cztery duże badania: HPTN 052, PARTNER, PARTNER2 i Opposites Attract.","held":"unverified","s":"HIV i-Base","c":"VERIFIED","ver":null,"gate":true},{"id":"0029","b":"uu","t":"podstawa dowodowa","w":"W badaniach nie odnotowano ani jednej transmisji seksualnej przy utrzymanej niewykrywalnej wiremii — łącznie w około 126 tysiącach aktów bez prezerwatywy.","held":"unverified","s":"NAM Publications","c":"VERIFIED","ver":null,"gate":true},{"id":"0030","b":"uu","t":"kto to potwierdza","w":"U=U poparły między innymi WHO, UNAIDS i CDC oraz ponad tysiąc organizacji ze 105 krajów.","held":"unverified","s":"Prevention Access Campaign","c":"VERIFIED","ver":null,"gate":true},{"id":"0031","b":"uu","t":"warunek","w":"Żeby U=U działało, wiremia musi być niewykrywalna trwale — zwykle rozumie się to jako poniżej 200 kopii na mililitr.","held":"unverified","s":"NYSDOH AIDS Institute Clinical Guidelines Program","c":"OFFICIAL","ver":null,"gate":true},{"id":"0032","b":"uu","t":"blipy","w":"Krótkie „blipy\", czyli chwilowe niskie wyniki wykrywalne, nie znosiły ochrony w badaniach.","held":"unverified","s":"NYSDOH AIDS Institute Clinical Guidelines Program","c":"OFFICIAL","ver":null,"gate":true},{"id":"0033","b":"uu","t":"granice U=U","w":"U=U udowodniono dla kontaktów seksualnych. To nie jest to samo co karmienie piersią czy wspólne igły.","held":"unverified","s":"NYSDOH AIDS Institute Clinical Guidelines Program","c":"OFFICIAL","ver":null,"gate":true},{"id":"0034","b":"uu","t":"granice U=U","w":"Przy karmieniu piersią na skutecznym leczeniu ryzyko zakażenia dziecka jest mniejsze niż 1 procent, ale nie zerowe.","held":"unverified","s":"NIH / DHHS (US)","c":"OFFICIAL","ver":null,"gate":true},{"id":"0035","b":"uu","t":"granice U=U","w":"Nie udowodniono, że osoba z niewykrywalną wiremią nie przenosi HIV przez wspólne igły.","held":"unverified","s":"NYSDOH AIDS Institute Clinical Guidelines Program","c":"OFFICIAL","ver":null,"gate":true},{"id":"0036","b":"ciaza","t":"ciąża","w":"Skuteczne leczenie w ciąży niemal całkowicie zapobiega przekazaniu HIV dziecku.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0037","b":"ciaza","t":"karmienie","w":"Karmienie mlekiem modyfikowanym albo pasteryzowanym mlekiem z banku daje zerowe ryzyko zakażenia dziecka.","held":"unverified","s":"NIH / DHHS (US)","c":"OFFICIAL","ver":null,"gate":true},{"id":"0038","b":"ciaza","t":"karmienie","w":"Od 2023 i 2024 roku wytyczne wspierają wspólne podejmowanie decyzji o karmieniu piersią zamiast bezwzględnego zakazu.","held":"unverified","s":"The Well Project","c":"VERIFIED","ver":null,"gate":true},{"id":"0039","b":"ciaza","t":"karmienie","w":"Osoba z HIV, która chce karmić piersią i ma utrwaloną supresję wirusa, powinna być wspierana, a nie straszona.","held":"unverified","s":"NIH / DHHS (US)","c":"OFFICIAL","ver":null,"gate":true},{"id":"0040","b":"wspolistniejace","t":"starzenie się","w":"Osoby żyjące z HIV częściej i wcześniej doświadczają chorób serca, nerek, kości i zaburzeń metabolicznych.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0041","b":"wspolistniejace","t":"koinfekcje","w":"Częste koinfekcje to WZW C, WZW B, gruźlica i kiła. Warto się w ich kierunku badać.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0042","b":"wspolistniejace","t":"zdrowie psychiczne","w":"Zdrowie psychiczne jest częścią opieki nad HIV. Depresja i lęk zdarzają się częściej i można je leczyć.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0043","b":"wspolistniejace","t":"szczepienia","w":"Osobom żyjącym z HIV zaleca się szereg szczepień, między innymi przeciw WZW A i B, pneumokokom, grypie, COVID-19 i HPV.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0044","b":"wspolistniejace","t":"profilaktyka oportunistyczna","w":"Przy niskiej liczbie CD4 stosuje się leki zapobiegające zakażeniom oportunistycznym.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0045","b":"wyleczenie","t":"stan badań","w":"Nie ma jeszcze leku, który całkowicie usuwa HIV z organizmu.","held":"unverified","s":"amfAR","c":"VERIFIED","ver":null,"gate":true},{"id":"0046","b":"wyleczenie","t":"przypadki remisji","w":"Dotąd siedem osób uznano za wyleczone lub będące w długiej remisji. Wszystkie po przeszczepie komórek krwiotwórczych z powodu nowotworu.","held":"unverified","s":"International AIDS Society","c":"VERIFIED","ver":null,"gate":true},{"id":"0047","b":"wyleczenie","t":"dlaczego nie dla wszystkich","w":"Przeszczep szpiku jest zbyt ryzykowny, żeby był metodą leczenia HIV. Służy nauce jako dowód, że wyleczenie w ogóle jest możliwe.","held":"unverified","s":"amfAR","c":"VERIFIED","ver":null,"gate":true},{"id":"0048","b":"wyleczenie","t":"drugi pacjent berliński","w":"„Drugi pacjent berliński\" z 2024 roku to pierwszy przypadek remisji od dawcy z pojedynczą, a nie podwójną mutacją CCR5-delta32.","held":"unverified","s":"International AIDS Society","c":"VERIFIED","ver":null,"gate":true},{"id":"0049","b":"wyleczenie","t":"co jest w badaniach","w":"Terapie genowe, przeciwciała szeroko neutralizujące i terapie CAR-T są w fazie badań, a nie w praktyce klinicznej.","held":"unverified","s":"NAM Publications","c":"VERIFIED","ver":null,"gate":true},{"id":"0050","b":"wyleczenie","t":"szczepionka","w":"Skutecznej szczepionki przeciw HIV na razie nie ma.","held":"unverified","s":"amfAR","c":"VERIFIED","ver":null,"gate":true},{"id":"0051","b":"prep","t":"czym jest PrEP","w":"PrEP to leki brane przez osobę bez HIV po to, żeby zapobiec zakażeniu.","held":"unverified","s":"Centers for Disease Control and Prevention (US)","c":"OFFICIAL","ver":null,"gate":true},{"id":"0052","b":"prep","t":"schematy","w":"PrEP można brać codziennie albo w schemacie „na żądanie\" 2-1-1: dwie tabletki przed seksem, po jednej przez dwa kolejne dni.","held":"unverified","s":"UCSF","c":"VERIFIED","ver":null,"gate":true},{"id":"0053","b":"prep","t":"schemat 2-1-1","w":"Schemat 2-1-1 zbadano w IPERGAY: 86 procent skuteczności, a w przedłużeniu badania 97 procent.","held":"unverified","s":"Molina J-M. i in., NEJM 2015","c":"VERIFIED","ver":null,"gate":true},{"id":"0054","b":"prep","t":"schemat 2-1-1","w":"Schemat 2-1-1 zaleca się mężczyznom mającym seks z mężczyznami. Nie jest zalecany przy ekspozycji waginalnej.","held":"unverified","s":"UCSF","c":"VERIFIED","ver":null,"gate":true},{"id":"0055","b":"prep","t":"lenakapawir","w":"Lenakapawir w zastrzyku co pół roku został zatwierdzony przez amerykański FDA 18 czerwca 2025 roku jako PrEP.","held":"unverified","s":"Gilead Sciences / FDA","c":"OFFICIAL","ver":null,"gate":true},{"id":"0056","b":"prep","t":"lenakapawir","w":"W badaniu PURPOSE 1, wśród kobiet, lenakapawir dał zero zakażeń.","held":"unverified","s":"New England Journal of Medicine","c":"VERIFIED","ver":null,"gate":true},{"id":"0057","b":"prep","t":"lenakapawir","w":"W badaniu PURPOSE 2 lenakapawir zmniejszył liczbę zakażeń o 96 procent.","held":"unverified","s":"New England Journal of Medicine","c":"VERIFIED","ver":null,"gate":true},{"id":"0058","b":"prep","t":"lenakapawir","w":"WHO zaleciło lenakapawir jako PrEP 14 lipca 2025 roku.","held":"unverified","s":"World Health Organization","c":"OFFICIAL","ver":null,"gate":true},{"id":"0059","b":"prep","t":"badania kontrolne","w":"Przed rozpoczęciem PrEP i w trakcie jego stosowania robi się test HIV, badania nerek i badania w kierunku innych chorób przenoszonych drogą płciową.","held":"unverified","s":"Centers for Disease Control and Prevention (US)","c":"OFFICIAL","ver":null,"gate":true},{"id":"0060","b":"prep","t":"czego PrEP nie robi","w":"PrEP nie chroni przed innymi chorobami przenoszonymi drogą płciową ani przed ciążą.","held":"unverified","s":"Centers for Disease Control and Prevention (US)","c":"OFFICIAL","ver":null,"gate":true},{"id":"0061","b":"prep-pl","t":"refundacja","w":"W Polsce w 2026 roku PrEP nie jest refundowany. Pacjent płaci pełną cenę leku, wizyty i badań.","held":"unverified","s":"Rynek Zdrowia (prasa branżowa)","c":"COMMUNITY","ver":null,"gate":true},{"id":"0062","b":"prep-pl","t":"koszt","w":"Miesięczny koszt generycznego PrEP w Polsce to orientacyjnie 150 do 200 złotych, z wahaniami przy brakach leku.","held":"unverified","s":"GdziePoLek.pl","c":"COMMUNITY","ver":null,"gate":true},{"id":"0063","b":"prep-pl","t":"recepta","w":"Od 19 września 2024 roku receptę na PrEP mogą wystawiać także lekarze podstawowej opieki zdrowotnej — nadal pełnopłatnie.","held":"unverified","s":"Rynek Zdrowia (prasa branżowa)","c":"COMMUNITY","ver":null,"gate":true},{"id":"0064","b":"prep-pl","t":"gdzie","w":"PrEP w Polsce można uzyskać w poradniach zakaźnych i wenerologicznych oraz w prywatnych klinikach w dużych miastach. Lista poradni jest na stronie Krajowego Centrum do spraw AIDS.","held":"unverified","s":"Krajowe Centrum ds. AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0065","b":"prep-pl","t":"refundacja","w":"Temat refundacji PrEP był na agendzie Parlamentarnego Zespołu do spraw HIV/AIDS w styczniu 2026 roku, ale świadczenie wciąż nie jest gwarantowane.","held":"unverified","s":"Rynek Zdrowia (prasa branżowa)","c":"COMMUNITY","ver":null,"gate":true},{"id":"0066","b":"pep","t":"czym jest PEP","w":"PEP to leki brane po możliwym kontakcie z HIV, żeby zapobiec zakażeniu.","held":"unverified","s":"Zjednoczenie Pozytywni w Tęczy","c":"VERIFIED","ver":null,"gate":true},{"id":"0067","b":"pep","t":"okno czasowe","w":"PEP trzeba zacząć jak najszybciej — najlepiej w ciągu dwóch godzin, maksymalnie do 48, a w uzasadnionych przypadkach do 72 godzin.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0068","b":"pep","t":"okno czasowe","w":"Po 72 godzinach PEP nie jest już zalecany — nie ma dowodów, że działa. Zgłoś się mimo to: potrzebne są testy wyjściowe i ocena, co dalej.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0069","b":"pep","t":"czas trwania","w":"PEP przyjmuje się codziennie przez 28 dni.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0070","b":"pep","t":"kto płaci","w":"W Polsce PEP przy ekspozycji zawodowej opłaca pracodawca.","held":"unverified","s":"gov.pl","c":"OFFICIAL","ver":null,"gate":true},{"id":"0071","b":"pep","t":"kto płaci","w":"Kto płaci za PEP pozazawodowy w Polsce, zależy od rodzaju ekspozycji i bywa różny — przy części sytuacji koszt może ponosić pacjent. Nie mamy tego jeszcze potwierdzonego u źródła, więc zapytaj o koszt na miejscu, w szpitalu zakaźnym — i nie odkładaj z tego powodu zgłoszenia.","held":"unverified","s":"Stowarzyszenie „Jeden Świat\"","c":"COMMUNITY","ver":null,"gate":true},{"id":"0072","b":"pep","t":"gdzie się zgłosić","w":"Po PEP zgłoś się bezpośrednio na SOR albo izbę przyjęć szpitala zakaźnego. Bez skierowania.","held":"unverified","s":"PKD Poznań","c":"COMMUNITY","ver":null,"gate":true},{"id":"0073","b":"pep","t":"anonimowość","w":"PEP nie jest anonimowy — lekarz musi ocenić ryzyko i prowadzić dokumentację, chronioną tajemnicą lekarską.","held":"unverified","s":"PKD Poznań","c":"COMMUNITY","ver":null,"gate":true},{"id":"0074","b":"pep","t":"czego PEP nie robi","w":"PEP nie chroni przed kiłą, rzeżączką, chlamydią, HPV ani innymi chorobami przenoszonymi drogą płciową.","held":"unverified","s":"PKD Poznań","c":"COMMUNITY","ver":null,"gate":true},{"id":"0075","b":"testowanie","t":"rodzaje testów","w":"Test czwartej generacji wykrywa antygen p24, zwykle po około dwóch tygodniach, oraz przeciwciała, po czterech do dwunastu tygodni.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0076","b":"testowanie","t":"rodzaje testów","w":"Są testy z krwi, ze śliny, testy szybkie i testy do samodzielnego wykonania w domu.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0077","b":"testowanie","t":"test molekularny","w":"Test molekularny wykrywa wirusa najwcześniej, bo szuka jego materiału genetycznego, a nie reakcji organizmu.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0078","b":"testowanie","t":"potwierdzenie wyniku","w":"Dodatni wynik testu przesiewowego zawsze wymaga potwierdzenia testem weryfikującym.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0079","b":"testowanie","t":"PKD","w":"W punkcie konsultacyjno-diagnostycznym test HIV jest bezpłatny, anonimowy i bez skierowania.","held":"unverified","s":"Krajowe Centrum ds. AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0080","b":"testowanie","t":"PKD","w":"Wynik z punktu konsultacyjno-diagnostycznego odbiera się osobiście, na hasło. Nie podaje się go przez telefon.","held":"unverified","s":"Krajowe Centrum ds. AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0081","b":"testowanie","t":"PKD","w":"W każdym województwie działa co najmniej jeden punkt konsultacyjno-diagnostyczny. Aktualna lista jest na stronie Krajowego Centrum do spraw AIDS.","held":"unverified","s":"Krajowe Centrum ds. AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0082","b":"testowanie","t":"PKD","w":"W punkcie konsultacyjno-diagnostycznym nie wystawia się recept ani nie prowadzi leczenia. To miejsce testowania i rozmowy.","held":"unverified","s":"Krajowe Centrum ds. AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0083","b":"ekspozycja","t":"pierwsze minuty","w":"Po zakłuciu nie wyciskaj rany. Przemyj ją wodą z mydłem.","held":"unverified","s":"gov.pl","c":"OFFICIAL","ver":null,"gate":true},{"id":"0084","b":"ekspozycja","t":"pierwsze minuty","w":"Błony śluzowe po ekspozycji przepłucz wodą albo solą fizjologiczną.","held":"unverified","s":"gov.pl","c":"OFFICIAL","ver":null,"gate":true},{"id":"0085","b":"ekspozycja","t":"zgłoszenie","w":"Zdarzenie ekspozycji zawodowej trzeba zgłosić przełożonemu i zarejestrować.","held":"unverified","s":"gov.pl","c":"OFFICIAL","ver":null,"gate":true},{"id":"0086","b":"ekspozycja","t":"kwalifikacja do PEP","w":"Po ekspozycji zgłoś się do ośrodka specjalistycznego najlepiej w ciągu 48 godzin, żeby ocenić potrzebę PEP.","held":"unverified","s":"gov.pl","c":"OFFICIAL","ver":null,"gate":true},{"id":"0087","b":"ekspozycja","t":"pacjent źródłowy","w":"Pacjenta źródłowego bada się w kierunku HIV testem czwartej generacji, za jego zgodą.","held":"unverified","s":"gov.pl","c":"OFFICIAL","ver":null,"gate":true},{"id":"0088","b":"prawo","t":"art. 161 KK","w":"Artykuł 161 Kodeksu karnego karze umyślne bezpośrednie narażenie innej osoby na zakażenie HIV — od trzech miesięcy do pięciu lat pozbawienia wolności.","held":"unverified","s":"Ustawodawca RP","c":"OFFICIAL","ver":null,"gate":true},{"id":"0089","b":"prawo","t":"art. 161 KK","w":"Przy narażeniu wielu osób kara wynosi od roku do dziesięciu lat.","held":"unverified","s":"Ustawodawca RP","c":"OFFICIAL","ver":null,"gate":true},{"id":"0090","b":"prawo","t":"art. 161 KK","w":"Ściganie z artykułu 161 następuje na wniosek pokrzywdzonego.","held":"unverified","s":"Ustawodawca RP","c":"OFFICIAL","ver":null,"gate":true},{"id":"0091","b":"prawo","t":"nowelizacja","w":"W 2024 roku Ministerstwo Zdrowia zaproponowało złagodzenie artykułu 161 i usunięcie wyodrębnienia HIV jako stygmatyzującego. Zmiana nie została uchwalona.","held":"unverified","s":"Termedia (prasa branżowa)","c":"COMMUNITY","ver":null,"gate":true},{"id":"0092","b":"prawo","t":"kryminalizacja","w":"UNAIDS krytykuje kryminalizację narażenia na HIV.","held":"unverified","s":"UNAIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0093","b":"prawo","t":"dane osobowe","w":"Dane o statusie HIV to dane o zdrowiu — szczególna kategoria chroniona przez RODO.","held":"unverified","s":"Parlament Europejski i Rada UE","c":"OFFICIAL","ver":null,"gate":true},{"id":"0094","b":"prawo","t":"tajemnica lekarska","w":"Status HIV jest objęty tajemnicą lekarską.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0095","b":"prawo","t":"praca","w":"Pracodawca co do zasady nie może wymagać testu na HIV ani pytać o status.","held":"unverified","s":"International Labour Organization","c":"VERIFIED","ver":null,"gate":true},{"id":"0096","b":"prawo","t":"praca","w":"Badania medycyny pracy nie obejmują rutynowo testu na HIV.","held":"unverified","s":"Ustawodawca RP","c":"OFFICIAL","ver":null,"gate":true},{"id":"0097","b":"prawo","t":"dyskryminacja","w":"Osobę żyjącą z HIV chroni zakaz dyskryminacji w zatrudnieniu.","held":"unverified","s":"Ustawodawca RP","c":"OFFICIAL","ver":null,"gate":true},{"id":"0098","b":"leczenie-pl","t":"bezpłatność","w":"W Polsce leczenie antyretrowirusowe jest bezpłatne dla każdej osoby z HIV, niezależnie od obywatelstwa i ubezpieczenia.","held":"unverified","s":"Ministerstwo Zdrowia","c":"OFFICIAL","ver":null,"gate":true},{"id":"0099","b":"leczenie-pl","t":"program","w":"Leczenie antyretrowirusowe finansuje Rządowy Program Polityki Zdrowotnej na lata 2022–2026.","held":"unverified","s":"Ministerstwo Zdrowia","c":"OFFICIAL","ver":null,"gate":true},{"id":"0100","b":"leczenie-pl","t":"cudzoziemcy","w":"Obywatele Ukrainy z HIV mogą kontynuować leczenie antyretrowirusowe w Polsce. Szerszy dostęp do świadczeń NFZ zmienił się po wygaszeniu specustawy w marcu 2026 roku.","held":"unverified","s":"Narodowy Fundusz Zdrowia","c":"OFFICIAL","ver":null,"gate":true},{"id":"0101","b":"stygma","t":"język","w":"Zamiast „nosiciel\" czy „zarażony\" mów „osoba żyjąca z HIV\" albo „osoba seropozytywna\".","held":"unverified","s":"Fundacja Edukacji Społecznej","c":"VERIFIED","ver":null,"gate":true},{"id":"0102","b":"stygma","t":"język","w":"Słowo „nosiciel\" jest stygmatyzujące i medycznie niepoprawne.","held":"unverified","s":"naTemat.pl","c":"COMMUNITY","ver":null,"gate":true},{"id":"0103","b":"stygma","t":"język","w":"Nie mów „ofiara AIDS\" ani „grupy ryzyka\". Mów o ryzykownych zachowaniach, nie o grupach ludzi.","held":"unverified","s":"Stowarzyszenie „Jeden Świat\"","c":"VERIFIED","ver":null,"gate":true},{"id":"0104","b":"stygma","t":"granice rozmowy","w":"Nie wypytuj osoby żyjącej z HIV o to, jak się zakaziła.","held":"unverified","s":"Fundacja Edukacji Społecznej","c":"VERIFIED","ver":null,"gate":true},{"id":"0105","b":"stygma","t":"skutki","w":"Stygmatyzacja związana z HIV pogarsza zdrowie psychiczne i zniechęca do testowania.","held":"unverified","s":"Mijas M. i in., Seksuologia Polska 2017","c":"VERIFIED","ver":null,"gate":true},{"id":"0106","b":"epidemiologia","t":"Polska 2024","w":"W 2024 roku w Polsce zgłoszono 2257 nowo wykrytych zakażeń HIV, 185 zachorowań na AIDS i 20 zgonów z powodu AIDS.","held":"unverified","s":"NIZP-PZH","c":"OFFICIAL","ver":null,"gate":true},{"id":"0107","b":"epidemiologia","t":"Polska od 1985","w":"Od 1985 roku do końca 2024 roku w Polsce wykryto ponad 32 900 zakażeń HIV.","held":"unverified","s":"NIZP-PZH","c":"OFFICIAL","ver":null,"gate":true},{"id":"0108","b":"epidemiologia","t":"późne rozpoznania","w":"W Polsce utrzymuje się problem późnych rozpoznań. Wiele osób dowiaduje się o zakażeniu w zaawansowanym stadium.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0109","b":"epidemiologia","t":"transmisja","w":"Osoby nieświadome swojego zakażenia odpowiadają za największą część nowych transmisji.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0110","b":"granice","t":"wyniki badań","w":"Krąg nie interpretuje wyników badań konkretnej osoby. Od tego jest lekarz.","held":"unverified","s":"Projekt Krąg","c":"COMMUNITY","ver":null,"gate":true},{"id":"0111","b":"granice","t":"leczenie","w":"Krąg nie sugeruje zmian w leczeniu ani doboru leków. Takie decyzje podejmuje lekarz prowadzący.","held":"unverified","s":"Projekt Krąg","c":"COMMUNITY","ver":null,"gate":true},{"id":"0112","b":"granice","t":"sytuacja nagła","w":"W nagłej sytuacji Krąg kieruje do PEP w szpitalu zakaźnym. Nie zastępuje kontaktu z lekarzem.","held":"unverified","s":"Projekt Krąg","c":"COMMUNITY","ver":null,"gate":true},{"id":"0201","b":"odbudowa","t":"dwie fazy odbudowy","w":"Po włączeniu leczenia liczba CD4 rośnie najszybciej przez pierwsze pół roku, potem coraz wolniej. W dużych kohortach pierwsza faza to rząd 265 komórek na rok, uśrednienie przez pierwsze dwa lata daje około 100, a po sześciu latach już tylko kilka.","held":"unverified","s":"OFID","c":"VERIFIED","ver":null,"gate":true},{"id":"0202","b":"odbudowa","t":"start z niskiego poziomu","w":"Start z bardzo niskiego CD4 nie zamyka drogi do odbudowy. W badaniach osoby zaczynające poniżej 50 komórek miały w drugiej fazie tempo równe lub szybsze niż zaczynające wyżej — po prostu dłużej pozostawały poniżej progu 200.","held":"unverified","s":"NIH PMC","c":"VERIFIED","ver":null,"gate":true},{"id":"0203","b":"odbudowa","t":"jak długo trwa","w":"Odbudowa liczy się w latach, nie w miesiącach. W jednej z kohort CD4 rosło średnio przez sześć i pół roku, zanim wyszło na płaskowyż. Punkt startu wpływa na to, gdzie ten płaskowyż wypadnie, ale nie na to, czy wzrost w ogóle nastąpi.","held":"unverified","s":"OFID","c":"VERIFIED","ver":null,"gate":true},{"id":"0204","b":"odbudowa","t":"brak odpowiedzi immunologicznej","w":"U części osób z niewykrywalną wiremią CD4 mimo to nie rośnie. Zależnie od przyjętej definicji dotyczy to od kilkunastu do kilkudziesięciu procent leczonych. Najsilniejszym czynnikiem ryzyka jest niski nadir, drugim wiek w chwili rozpoczęcia leczenia.","held":"unverified","s":"Frontiers","c":"VERIFIED","ver":null,"gate":true},{"id":"0205","b":"odbudowa","t":"czego nie robi się przy słabej odbudowie","w":"Przy niewykrywalnej wiremii i słabo rosnącym CD4 nie dokłada się kolejnych leków ani nie zmienia schematu wyłącznie po to, by podnieść limfocyty — wytyczne odradzają to wprost. Interleukina-2 podnosi CD4, ale w dużych badaniach nie zmniejszyła ryzyka zachorowania ani zgonu.","held":"unverified","s":"DHHS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0206","b":"odbudowa","t":"wskaźnik CD4/CD8","w":"Stosunek CD4 do CD8 bywa lepszym wskaźnikiem przewlekłego stanu zapalnego niż samo CD4. Bywa niski nawet wtedy, gdy CD4 wróciło powyżej 500, i wiąże się z ryzykiem chorób niezwiązanych z AIDS.","held":"unverified","s":"JAC","c":"VERIFIED","ver":null,"gate":true},{"id":"0207","b":"odbudowa","t":"czego nie zmienisz","w":"Na tempo odbudowy wpływają rzeczy przesądzone przed diagnozą: wiek w chwili rozpoczęcia leczenia, najniższy poziom CD4 w historii, czas od zakażenia do leczenia oraz funkcja grasicy. Wolniejsza odbudowa nie jest niczyją winą.","held":"unverified","s":"DHHS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0208","b":"odbudowa","t":"co jest po Twojej stronie","w":"Jedyną rzeczą o udowodnionym wpływie na odbudowę jest regularne przyjmowanie leków i utrzymanie niewykrywalnej wiremii. Poza tym liczy się leczenie koinfekcji, szczepienia we właściwym momencie, niepalenie i leczenie depresji — to ostatnie głównie dlatego, że ułatwia regularność.","held":"unverified","s":"DHHS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0209","b":"odbudowa","t":"ruch a CD4","w":"Przeglądy systematyczne pokazują, że regularny wysiłek u osób z HIV poprawia wydolność, siłę, nastrój i jakość życia, i jest bezpieczny. Nie wykazano natomiast, żeby podnosił CD4 albo obniżał wiremię.","held":"unverified","s":"Cochrane","c":"VERIFIED","ver":null,"gate":true},{"id":"0210","b":"odbudowa","t":"suplementy a odbudowa","w":"Przeglądy Cochrane nie wykazały istotnego wpływu suplementacji mikroelementów na CD4 ani przeżycie u osób prawidłowo odżywionych. Suplementacja ma uzasadnienie przy niedoborze potwierdzonym badaniem, a nie profilaktycznie.","held":"unverified","s":"Cochrane","c":"VERIFIED","ver":null,"gate":true},{"id":"0211","b":"odbudowa","t":"rokowanie a moment rozpoczęcia leczenia","w":"Osoby zaczynające leczenie z wysokim CD4 mają dziś oczekiwaną długość życia zbliżoną do populacji ogólnej. Przy bardzo niskim CD4 na starcie różnica jest istotna, ale dane dla osób rozpoczynających leczenie po 2015 roku są wyraźnie lepsze niż wcześniejsze.","held":"unverified","s":"Lancet","c":"VERIFIED","ver":null,"gate":true},{"id":"0212","b":"bezpieczenstwo","t":"profilaktyka PCP","w":"Przy CD4 poniżej 200 lekarz zwykle dokłada lek osłonowy przeciw zapaleniu płuc wywołanemu przez Pneumocystis. Odstawia się go po utrzymaniu CD4 powyżej 200 przez około trzy miesiące — decyzję podejmuje lekarz prowadzący.","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"0213","b":"bezpieczenstwo","t":"profilaktyka toksoplazmozy","w":"Przy CD4 poniżej 100 i dodatnim wyniku przeciwciał stosuje się profilaktykę toksoplazmozy. Odstawia się ją po odbudowie powyżej 200.","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"0214","b":"bezpieczenstwo","t":"MAC","w":"Prątki atypowe stanowią ryzyko przy CD4 poniżej 50. Przy skutecznym leczeniu antyretrowirusowym osobna profilaktyka zwykle nie jest już potrzebna.","held":"unverified","s":"DHHS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0215","b":"bezpieczenstwo","t":"pogorszenie po starcie leczenia","w":"W pierwszych tygodniach leczenia może pojawić się gorączka, powiększone węzły lub nasilenie objawów istniejącego zakażenia. To zespół rekonstytucji immunologicznej i zwykle oznacza, że układ odpornościowy zaczyna działać, a nie że lek zawodzi. Objaw trzeba zgłosić lekarzowi, ale nie odstawiać leków samodzielnie.","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"0216","b":"bezpieczenstwo","t":"szczepionki żywe","w":"Przy CD4 poniżej 200 szczepionki żywe są przeciwwskazane — dotyczy to odry, świnki i różyczki, ospy wietrznej, żółtej gorączki oraz doustnej szczepionki przeciw durowi brzusznemu.","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"0217","b":"bezpieczenstwo","t":"szczepionki zalecane","w":"Szczepionki nieżywe są bezpieczne i zalecane: WZW typu A i B, HPV, grypa, pneumokoki, COVID-19, a według wskazań także półpasiec w wersji rekombinowanej. Przy niskim CD4 odpowiedź bywa słabsza, więc część szczepień lekarz przesuwa na czas po odbudowie.","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"0218","b":"bezpieczenstwo","t":"codzienne środki ostrożności","w":"Przy niskim CD4 sens mają: mycie rąk, rękawiczki przy sprzątaniu po zwierzęciu, dobrze wysmażone mięso i jajka, mycie warzyw oraz konsultacja przed dalszą podróżą. Oddawanie zwierzęcia nie jest zalecane — liczy się higiena, nie pozbycie się psa czy kota.","held":"unverified","s":"NAM","c":"COMMUNITY","ver":null,"gate":true},{"id":"0219","b":"psyche","t":"pierwszy rok","w":"Pierwszy rok po diagnozie jest dla większości osób najtrudniejszy i to najczęstszy przebieg, a nie wyjątek. Około jednej trzeciej osób żyjących z HIV doświadcza depresji, z nasileniem w pierwszych miesiącach po wyniku.","held":"unverified","s":"BMJ","c":"VERIFIED","ver":null,"gate":true},{"id":"0220","b":"psyche","t":"samostygmatyzacja","w":"Najsilniej szkodzi nie sam wirus, tylko przejęcie cudzych sądów jako własnych. W badaniach samostygmatyzacja jest jednym z najmocniejszych czynników związanych z depresją — i jednym z niewielu, które da się zmienić.","held":"unverified","s":"PLOS","c":"VERIFIED","ver":null,"gate":true},{"id":"0221","b":"psyche","t":"co ma dowody","w":"Dowody mają: kontakt z osobą, która przeszła to samo, wsparcie rówieśnicze, terapia poznawczo-behawioralna oraz leczenie depresji. W badaniu z Los Angeles osoby z przydzielonym towarzyszem z doświadczeniem utrzymały skuteczność leczenia po roku na poziomie 49 procent wobec 30 procent bez takiego wsparcia.","held":"unverified","s":"JAMA","c":"VERIFIED","ver":null,"gate":true},{"id":"0222","b":"psyche","t":"granice pozytywnego myślenia","w":"W badaniu z grupą kontrolną osiem tygodni treningu uważności poprawiło nastrój, poziom stresu i samopoczucie, ale nie zmieniło ani CD4, ani markerów zapalnych. Depresja szkodzi zdrowiu przede wszystkim przez to, że utrudnia regularne branie leków — i dlatego warto ją leczyć.","held":"unverified","s":"Elsevier","c":"VERIFIED","ver":null,"gate":true},{"id":"0223","b":"pierwsze-dni","t":"diagnoza to nie wyrok","w":"Dziś HIV jest chorobą przewlekłą, leczoną codzienną terapią. Przy leczeniu, zwłaszcza rozpoczętym przy zachowanej odporności, oczekiwana długość życia jest zbliżona do długości życia osób bez HIV.","held":"unverified","s":"Lancet","c":"VERIFIED","ver":null,"gate":true},{"id":"0224","b":"pierwsze-dni","t":"tempo — co jest pilne, a co nie","w":"Leczenie antyretrowirusowe zaczyna się szybko po diagnozie, ale nie w trybie nagłym jak PEP. Jest czas na badania wyjściowe i rozmowę z lekarzem — pilne jest umówienie się do poradni, nie podejmowanie wszystkich decyzji naraz.","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"0225","b":"pierwsze-dni","t":"pierwsze badania","w":"Na starcie opieki lekarz zleca zwykle liczbę CD4, wiremię, badania nerek i wątroby oraz badania w kierunku koinfekcji: HBV, HCV, kiły i gruźlicy. To punkt odniesienia dla dalszego leczenia.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0226","b":"pierwsze-dni","t":"głowa w pierwszych tygodniach","w":"Szok, lęk i przytłoczenie w pierwszych tygodniach po diagnozie to najczęstszy przebieg, a nie wyjątek. Pierwszy rok bywa najtrudniejszy psychicznie — dlatego warto od początku mieć z kim o tym rozmawiać: lekarza, psychologa albo kogoś, kto to przeszedł.","held":"unverified","s":"BMJ","c":"VERIFIED","ver":null,"gate":true},{"id":"0227","b":"dlugoterminowo","t":"rokowanie zaciera się z czasem","w":"Różnica w długości życia jest największa przy bardzo niskim CD4 na starcie, ale częściowo zaciera się z każdym rokiem skutecznego leczenia. Dane dla osób rozpoczynających leczenie po 2015 roku są wyraźnie lepsze niż wcześniejsze.","held":"unverified","s":"Lancet","c":"VERIFIED","ver":null,"gate":true},{"id":"0228","b":"dlugoterminowo","t":"co się monitoruje przez lata","w":"W stabilnym leczeniu regularnie kontroluje się wiremię i CD4, a z czasem także ciśnienie, lipidy, poziom cukru oraz pracę nerek i wątroby — bo z wiekiem rośnie ryzyko chorób niezwiązanych z AIDS.","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"0229","b":"dlugoterminowo","t":"główne ryzyko długoterminowe","w":"U osób długo żyjących z HIV głównym ryzykiem stają się choroby serca, nerek, kości, wątroby oraz nowotwory niezwiązane z AIDS. Dlatego niepalenie, ruch i leczenie chorób współistniejących mają realne znaczenie.","held":"unverified","s":"Polskie Towarzystwo Naukowe AIDS","c":"OFFICIAL","ver":null,"gate":true},{"id":"0230","b":"dlugoterminowo","t":"opieka to nie tylko tabletka","w":"Opieka długoterminowa obejmuje plan szczepień, profilaktykę i badania przesiewowe dostosowane do wieku i odporności. Część szczepień uzupełnia się lub powtarza po odbudowie liczby CD4.","held":"unverified","s":"European AIDS Clinical Society","c":"OFFICIAL","ver":null,"gate":true},{"id":"pep-0001","b":"miejsca","t":"DYZUR_PEP","w":"Wojewódzki Szpital Zakaźny — Izba Przyjęć— ul. Wolska 37, 01-201 Warszawa tel. 22 335 52 65, 22 335 53 30, 22 335 52 61 (całodobowo)","held":"unverified","s":"Krajowe Centrum ds. AIDS / gov.pl","c":"OFFICIAL","ver":null,"ga function isFollowUp(q){
  var n=norm(q);

  if(n.split(' ').length<=4) return true;

function searchIn(blocks,q){
  var n=norm(q), words=n.split(' ').filter(function(w){return w.length>2});
  var pool=FACTS.filter(function(f){return blocks.indexOf(f.b)>-1});
  var ranked=pool.map(function(f){
    var hay=norm(f.t+' '+f.w), sc=0;
    words.forEach(function(w){ if(hay.indexOf(w)>-1) sc+=1 });
    if(/\b(0|zero|zer)\b/.test(n)&&/prog|zero|bez wirusa|kopii/.test(hay)) sc+=5;
    if(/nie mam|nie osiagn|jeszcze nie|dopiero/.test(n)&&/prog|celem|trwale|zwykle/.test(hay)) sc+=3;
    return {f:f,s:sc}}).sort(function(a,b){return b.s-a.s});
  var top=ranked.filter(function(r){return r.s>0}).slice(0,3);
  return top.length?top.map(function(r){return r.f}):null;
}
function scoreBlocks(q){
  var n=norm(q), tk=toks(q);
  if(!tk.length) return {best:null,val:0,per:[]};
  var bonus={};
  Object.keys(ALIAS).forEach(function(bk){
    ALIAS[bk].forEach(function(al){
      var an=norm(al);
      if(an.indexOf(' ')>-1){ if(n.indexOf(an)>-1) bonus[bk]=(bonus[bk]||0)+8 }
      else { var as=stem(an);
        if(tk.some(function(t){return t.indexOf(as)===0||(as.indexOf(t)===0&&t.length>4)}))
          bonus[bk]=(bonus[bk]||0)+8 }
    });
  });
  var per=FACTS.map(function(f){
    var ts=norm(f.t).split(' '), ws=norm(f.w).split(' '), sc=0;
    tk.forEach(function(t){
      if(ts.some(function(x){return stem(x).indexOf(t)===0}))sc+=4;
      else if(ws.some(function(x){return stem(x).indexOf(t)===0}))sc+=1.5;
    });
    return {f:f,s:sc};
  });
  var byBlock={};
  per.forEach(function(r){ if(!byBlock[r.f.b]||r.s>byBlock[r.f.b]) byBlock[r.f.b]=r.s });
  var rb=roleObj().boost;
  var best=null,val=0;
  Object.keys(byBlock).concat(Object.keys(bonus)).forEach(function(bk){
    var v=(byBlock[bk]||0)+(bonus[bk]||0)+(rb.indexOf(bk)>-1?3:0);
    if(v>val){val=v;best=bk}
  });
  return {best:best,val:val,per:per};
}
function pack(block,per,extra){
  var ranked=per.filter(function(r){return r.f.b===block}).sort(function(a,b){return b.s-a.s});
  var top=ranked.filter(function(r){return r.s>0}).slice(0,4);
  if(!top.length){
    // Brak trafień w bloku: pokaż jeden ogólny fakt i NIGDY nie dopełniaj przypadkowymi (R-3).
    // Fakty o odpowiedzialności karnej (0088–0090) nie wchodzą jako wypełniacz.
    var safe=ranked.filter(function(r){return ['0088','0089','0090'].indexOf(r.f.id)<0});
    top=(safe[0]?[safe[0]]:ranked.slice(0,1));
  }
  var o={block:block,facts:top.map(function(r){return r.f})};
  if(extra) for(var k in extra) o[k]=extra[k];
  return o;
}
function threadSearch(q){
  if(!lastBlock) return null;
  var n=norm(q), words=n.split(' ').filter(function(w){return w.length>3&&!STOP[w]});
  var scope=[lastBlock].concat(NEAR[lastBlock]||[]);
  var ranked=FACTS.filter(function(f){return scope.indexOf(f.b)>-1}).map(function(f){
    var hay=norm(f.t+' '+f.w), sc=(f.b===lastBlock?2:0);
    words.forEach(function(w){ if(hay.indexOf(w)>-1) sc+=1 });
    if(/(^| )(0|zero)( |$)/.test(n)&&/prog|bez wirusa|kopii/.test(hay)) sc+=6;
    if(/nie mam|jeszcze nie|dopiero|nie osiagn/.test(n)&&/prog|trwale|celem|zwykle/.test(hay)) sc+=4;
    if(/ile czasu|jak szybko|kiedy|do kiedy/.test(n)&&/godzin|dni|najszybciej|okno/.test(hay)) sc+=6;
    if(/na pewno|pewne|dowod|badani/.test(n)&&/badani|dowod|potwierdzi/.test(hay)) sc+=5;
    return {f:f,s:sc}}).sort(function(x,y){return y.s-x.s});
  var top=ranked.filter(function(r){return r.s>3}).slice(0,3);
  if(!top.length) return null;
  return {block:top[0].f.b,facts:top.map(function(r){return r.f}),follow:true};
}

function pepUrgent(n){
  var fresh=/(wczoraj|dzisiaj|\bdzis\b|przed chwil|w nocy|dzis rano|godzin temu|godzine temu|godziny temu|dni temu|kilka dni temu|niedawno|dopiero co|przed momentem|pare godzin|\d+ ?h temu)/;
  var expo=/(seks|stosunek|prezerwatyw|bez zabezpiecz|\bigl|zaklu|naraz|ekspozycj|gwalt|zgwalc|wspoln. igl|ryzykown|bez gumk)/;
  return fresh.test(n)&&expo.test(n);
}
// Granica wyrobu medycznego jako reguła semantyczna, nie lista fraz (R-6): pytanie o WŁASNY
// wynik lub o decyzję lekową → „granice", w PL/EN/RU.
function boundSemantic(n){
  var mine=/\bmoj\b|\bmoja\b|\bmoje\b|\bmoich\b|\bmi\b|u mnie|\bmam\b|\bmy \b|\bмо/;
  var result=/\bcd4\b|wiremi|viral load|\bvl\b|\bkopii\b|\bwynik/;
  var decide=/zmieni|odstawi|przestac|change|stop|switch|adjust|jaki lek|dobrac lek/;
  var med=/\blek|lecz|medication|terapi|schemat|\barv\b|tablet|dawk/;
  if(result.test(n)&&(mine.test(n)||/\bcd4 \d+|wiremia \d+/.test(n))) return true;
  if(decide.test(n)&&(result.test(n)||med.test(n))) return true;
  return false;
}
function findFacts(q){
  var n=norm(q);
  for(var bi=0;bi<BOUND.length;bi++) if(BOUND[bi].test(n))
    return {block:'granice',facts:FACTS.filter(function(f){return f.b==='granice'}),bound:true};
  if(boundSemantic(n))
    return {block:'granice',facts:FACTS.filter(function(f){return f.b==='granice'}),bound:true};
  if(pepUrgent(n)){ var sp=scoreBlocks(q); return pack('pep',sp.per,{urgentForced:true}); }
  var sc=scoreBlocks(q);
  if(sc.best&&sc.val>=6) return pack(sc.best,sc.per);
  var th=threadSearch(q);
  if(th) return th;
  if(sc.best&&sc.val>=4){ var p=pack(sc.best,sc.per); p.unsure=true; return p; }  // niepewne (R-4)
  return null;
}

var REV={card:{},day:0,streak:14,doneToday:0};
var NEW_PER_DAY=8, IVL=[0,1,3,7,14,30];
function revPool(){
  var seen={},out=[];
  PATHS_DB.filter(function(p){return p.roles.indexOf(role)>-1}).forEach(function(p){
    p.blocks.forEach(function(b){factsOf(b).forEach(function(f){if(!seen[f.id]){seen[f.id]=1;out.push(f)}})});
  });
  return out;
}
function revDue(){
  var pool=revPool(), due=[], fresh=[];
  pool.forEach(function(f){
    var c=REV.card[f.id];
    if(c){ if(c.due<=REV.day) due.push(f); }
    else fresh.push(f);
  });
  return due.concat(fresh.slice(0,Math.max(0,NEW_PER_DAY-REV.doneToday)));
}
function revLearned(){var n=0;for(var k in REV.card)if(REV.card[k].box>=2)n++;return n}
function revBadges(){return Math.floor(revLearned()/10)+ (REV.streak>=14?1:0)}
function renderTrenerw(){
  var el=$('#trenerwBody');if(!el)return;var P=lang==='pl';
  var due=revDue().length, learned=revLearned();
  el.innerHTML=
    '<p class="lbl">'+t('revDueLbl')+'</p>'+
    '<div class="card"><p style="margin:0 0 4px"><b class="stnum" style="font-size:26px">'+due+'</b> '+
      (P?(due===1?'fiszka':(due>=2&&due<=4?'fiszki':'fiszek')):'cards')+'</p>'+

      (due?'<button class="btn sm" id="revStartBtn">'+t('revStart')+'</button>':'')+'</div>'+
    '<p class="lbl">'+t('paths')+'</p><div class="card" style="padding:6px 16px" id="paths"></div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px">'+
      '<div class="card" style="text-align:center;padding:13px 8px"><b class="stnum">'+REV.streak+'</b><span class="stlbl">'+t('streakD')+'</span></div>'+
      '<div class="card" style="text-align:center;padding:13px 8px;margin:0"><b class="stnum">'+learned+'</b><span class="stlbl">'+t('revLearned')+'</span></div>'+
      '<div class="card" style="text-align:center;padding:13px 8px;margin:0"><b class="stnum">'+revBadges()+'</b><span class="stlbl">'+t('badgesN')+'</span></div>'+
    '</div>';
  renderPaths2();
  var b=$('#revStartBtn');if(b)b.addEventListener('click',startReview);

var revQueue=[], revPos=0, revShown=false;
function startReview(){ revQueue=revDue(); revPos=0; revShown=false; if(!revQueue.length){renderTrenerw();return} drawCard(); go('powtorka'); }
function drawCard(){
  var el=$('#powtorkaBody');if(!el)return;var P=lang==='pl';
  if(revPos>=revQueue.length){
    el.innerHTML='<div class="rev" style="align-items:center;justify-content:center;text-align:center">'+
      '<p class="rfront">'+t('revAllDone')+'</p><p class="rback">'+revQueue.length+' '+(P?'fiszek':'cards')+'</p></div>'+
      '<button class="btn" id="revBack">'+(P?'Wróć':'Back')+'</button>';
    REV.streak+=0; REV.doneToday+=revQueue.length; REV.day+=1;
    $('#revBack').addEventListener('click',function(){go('trenerw')});
    return;
  }
  var f=revQueue[revPos];
  var pct=Math.round(revPos/revQueue.length*100);
  el.innerHTML='<div class="revprog"><i style="width:'+pct+'%"></i></div>'+
    '<div class="rev"><div class="rlbl">'+bn(f.b)+' · '+(revPos+1)+'/'+revQueue.length+'</div>'+
    '<p class="rfront">'+f.t+'</p>'+
    (revShown?'<p class="rback">'+f.w+'</p><div class="rsrc">'+confBadge(f.c)+f.s+'</div>':'')+
    '<div style="flex:1"></div>'+
    (revShown
      ?'<div class="revbtns"><button class="rb-again" id="rAgain">'+t('revAgain')+'</button><button class="rb-know" id="rKnow">'+t('revKnow')+'</button></div>'
      :'<div class="revbtns"><button class="rb-show" id="rShow">'+t('revShow')+'</button></div>')+
    '</div>';
  if(revShown){
    $('#rAgain').addEventListener('click',function(){rate(1)});
    $('#rKnow').addEventListener('click',function(){rate(2)});
  } else $('#rShow').addEventListener('click',function(){revShown=true;drawCard()});
}
function rate(kind){
  var f=revQueue[revPos];var c=REV.card[f.id]||{box:1,due:0};
  if(kind===2)c.box=Math.min(5,c.box+1); else c.box=1;
  c.due=REV.day+IVL[c.box];
  REV.card[f.id]=c; revPos++; revShown=false; drawCard();
}

function nearestArea(la,lo){
  var best=null,bd=1e9;
  AREAS.forEach(function(a){
    var dx=(a[1]-la)*111,dy=(a[2]-lo)*111*Math.cos(la*Math.PI/180);
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<bd){bd=d;best=a[0]}
  });
  return bd<90?best:null;
}

   Przy wiremii przecinek w złym miejscu to trzy rzędy wielkości, więc lepiej
   zapytać raz za dużo niż zapisać 19 000 zamiast 19. */
var RANGE={
 vl:{min:0,max:10000000,typo:/^0[.,]/,
     hint:{pl:'Wiremia podawana jest w kopiach na mililitr, zwykle liczbą całkowitą.',
           en:'Viral load is in copies per millilitre, usually a whole number.'}},
 cd4:{min:0,max:5000,
     hint:{pl:'CD4 podawane jest w komórkach na mikrolitr — zwykle od kilkudziesięciu do ponad tysiąca.',
           en:'CD4 is in cells per microlitre — usually tens to over a thousand.'}},
 alt:{min:0,max:3000,
     hint:{pl:'ALT podawane jest w jednostkach na litr.',en:'ALT is in units per litre.'}}
};
function checkVal(sel,v){
  var r=RANGE[sel];if(!r)return null;
  if(isNaN(v))return {bad:true,msg:lang==='pl'?'To nie jest liczba.':'Not a number.'};
  if(v<r.min||v>r.max)return {bad:true,msg:(lang==='pl'
    ?'Wartość poza spodziewanym zakresem. ':'Value outside the expected range. ')+(r.hint[lang]||r.hint.en)};
  return null;
}

 cd4:{unit:'/µl',log:false,thr:500,pts:[['02.25',310],['05.25',390],['08.25',465],['11.25',520],['02.26',580],['05.26',610]]},

function bindEmpty(){
  $$('[data-empty]').forEach(function(e){e.addEventListener('click',function(){
    var a=e.dataset.empty;
    if(a==='wrzut')go('wrzut');
    else if(a==='lek')go('lekdodaj');
    else if(a==='ida')go('ida');
    else if(a==='comp')go('comp');
    else if(a==='profil')go('ja');

function draw(){
  var dd=DATA[series];
  var cc=$('#chartCard');
  if(!cc)return;
  if(!dd||!dd.pts.length){
    var P=lang==='pl';
    if(cc){cc.innerHTML=emptyBox('◌',
      P?'Brak wyników w tej kategorii':'No results in this category',
      P?'Wykres pojawi się po wpisaniu dwóch pomiarów. Jeden punkt to jeszcze nie przebieg.'
       :'The chart appears after two measurements. One point is not a trend yet.',
      P?'Wrzuć wynik':'Add a result','wrzut');bindEmpty()}
    return;
  }
  if(!$('#chart')) cc.innerHTML='<svg id="chart" viewBox="0 0 320 170"></svg><p class="foot" id="chartFoot"></p>';
  var d=DATA[series],W=320,H=170,L=40,R=10,Tp=14,B=26;
  var xs=function(i){return L+i*((W-L-R)/(d.pts.length-1))};
  var f=function(v){return d.log?Math.log10(Math.max(v,1)):v};
  var vals=d.pts.map(function(p){return f(p[1])}).concat([f(d.thr)]);
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  var pad=(mx-mn)*0.14||1;mn-=pad;mx+=pad;
  var ys=function(v){return Tp+(H-Tp-B)*(1-(f(v)-mn)/(mx-mn))};
  var s='';
  [0,.5,1].forEach(function(k){var y=Tp+(H-Tp-B)*k;
    s+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/>'});
  s+='<line class="thr" x1="'+L+'" y1="'+ys(d.thr).toFixed(1)+'" x2="'+(W-R)+'" y2="'+ys(d.thr).toFixed(1)+'"/>'+
     '<path class="ln" d="'+d.pts.map(function(p,i){return (i?'L':'M')+xs(i).toFixed(1)+' '+ys(p[1]).toFixed(1)}).join(' ')+'"/>';
  d.pts.forEach(function(p,i){
    s+='<circle class="pt" cx="'+xs(i).toFixed(1)+'" cy="'+ys(p[1]).toFixed(1)+'" r="3.2"/>';
    if(i%2===0||i===d.pts.length-1)
      s+='<text class="axis" x="'+xs(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+p[0]+'</text>';
  });
  $('#chart').innerHTML=s;
  var last=d.pts[d.pts.length-1];
  $('#chartFoot').innerHTML=t('lastEntry')+': <b style="color:var(--tx)">'+last[1]+' '+d.unit+'</b> ('+last[0]+'). '+t('noInterpret');
}

$('#pdf').addEventListener('click',function(){

        '<input type="text" inputmode="decimal" data-man="'+x[0]+'" placeholder="—"></div>'}).join('')+'</div>'+

    '<div id="manErr"></div>'+
    '<button class="btn" style="margin-top:14px" id="manSave">'+t('confirmSave')+'</button>'+
    '<button class="btn ghost sm" style="margin-top:9px" id="manBack">'+(P?'Wróć':'Back')+'</button>';
  $('#wStep2').style.display='';
  $('#manBack').onclick=function(){$('#wStep1').style.display='';$('#wStep2').style.display='none';resetDrop()};
  $('#manSave').onclick=function(){
    var errs=[],saved=0;
    $$('[data-man]').forEach(function(inp){
      var raw=inp.value.trim();if(!raw)return;
      var v=parseFloat(raw.replace(',','.'));
      var e=checkVal(inp.dataset.man,v);
      if(e){errs.push(e.msg);inp.style.borderColor='rgba(201,90,90,.6)';return}
      inp.style.borderColor='';
      DATA[inp.dataset.man].pts.push([shortDate($('#manDate').value),v]);
      if(DATA[inp.dataset.man].pts.length>7)DATA[inp.dataset.man].pts.shift();
      saved++;
    });
    if(errs.length){$('#manErr').innerHTML='<div class="warnbox"><p>'+errs.join('<br>')+'</p></div>';return}
    if(!saved){$('#manErr').innerHTML='<div class="warnbox"><p>'+(P?'Nie wpisano żadnej wartości.':'No value entered.')+'</p></div>';return}
    $('#manErr').innerHTML='';draw();go('zdrowie');seg('z','wyniki');toast(t('savedChart'));
    $('#wStep1').style.display='';$('#wStep2').style.display='none';resetDrop();
  };
}
function shortDate(x){
  var m=(x||'').match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);
  if(!m)return '—';
  return ('0'+m[2]).slice(-2)+'.'+m[3].slice(-2);
}
$('#drop').addEventListener('click',function(){
  if($('#drop').dataset.busy)return;$('#drop').dataset.busy='1';
  readAttempt++;
  if(readAttempt%3===0){ /* co trzecia próba w prototypie kończy się niepowodzeniem */
    $('#drop').innerHTML='<span class="i">◌</span><div class="t">'+t('reading')+'</div>';
    setTimeout(function(){$('#drop').dataset.busy='';readFailed()},900);
    return;
  }
  $('#drop').innerHTML='<span class="i">◌</span><div class="t">'+t('reading')+'</div>';
  setTimeout(function(){
    $('#drop').dataset.busy='';
    $('#wStep1').style.display='none';
    var h='<div class="card" style="margin-bottom:14px"><p>'+t('found4')+'</p></div><p class="lbl">'+t('recognised')+'</p><div class="card" style="padding:4px 16px">';
    EXTRACT.forEach(function(e,i){
      h+='<div class="ext"><span class="k">'+e.k+'<br><span style="font-size:11.5px;color:var(--tx-3)">'+e.u+'</span></span>'+
        '<span class="conf '+(e.c==='hi'?'c-hi':'c-lo')+'">'+(e.c==='hi'?t('certain'):t('checkThis'))+'</span>'+
        '<input type="text" value="'+e.v+'" data-ex="'+i+'"></div>';
    });
    h+='</div><div id="exErr"></div><p class="note">'+t('extNote')+'</p><button class="btn" style="margin-top:16px" id="confirmEx">'+t('confirmSave')+'</button>'+
      '<button class="btn ghost sm" style="margin-top:9px" id="againEx">'+t('loadAnother')+'</button>';
    $('#wStep2').innerHTML=h;$('#wStep2').style.display='';
    $('#confirmEx').addEventListener('click',function(){
      var errs=[];
      $$('[data-ex]').forEach(function(inp){
        var e=EXTRACT[inp.dataset.ex];if(!e.s)return;
        var raw=inp.value.trim();if(!raw)return;
        var val=parseFloat(raw.replace(',','.'));
        var er=checkVal(e.s,val);
        if(er){errs.push(e.k+': '+er.msg);inp.style.borderColor='rgba(201,90,90,.6)'}
        else inp.style.borderColor='';
      });
      if(errs.length){
        var box=$('#exErr');
        if(box)box.innerHTML='<div class="warnbox"><h4>'+(lang==='pl'?'Sprawdź wartości':'Check the values')+
          '</h4><p>'+errs.join('<br>')+'</p></div>';
        return;
      }
      $$('[data-ex]').forEach(function(inp){
        var e=EXTRACT[inp.dataset.ex];if(!e.s)return;
        var val=parseFloat((inp.value||'').replace(',','.'));
        if(!isNaN(val)){DATA[e.s].pts.push(['07.26',val]);if(DATA[e.s].pts.length>7)DATA[e.s].pts.shift()}});
      draw();go('zdrowie');seg('z','wyniki');toast(t('savedChart'));
      $('#wStep1').style.display='';$('#wStep2').style.display='none';resetDrop();});
    $('#againEx').addEventListener('click',function(){
      $('#wStep1').style.display='';$('#wStep2').style.display='none';resetDrop()});
  },900);
});

function subsOf(list){var o={};list.forEach(function(m){(m.s||[]).forEach(function(x){o[x]=m.n});
  if(m.t==='arv'){o.arv=o.arv||m.n; if((m.s||[]).some(function(x){return INSTI.indexOf(x)>-1}))o.insti=m.n}});return o}
function interactions(list){
  var S=subsOf(list),out=[];
  RULES.forEach(function(r){
    if(S[r.a]&&S[r.b]&&S[r.a]!==S[r.b]) out.push({sev:r.sev,pair:S[r.a]+' + '+S[r.b],txt:r[lang]||r.pl});
  });
  var order={stop:0,gap:1,care:2};
  return out.sort(function(a,b){return order[a.sev]-order[b.sev]});
}
